services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nyaysahayak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyaysahayak}
      POSTGRES_USER: ${POSTGRES_APP_USER:-nyaya_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:-nyaya_app_dev}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - nyaya_pg_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nyaya_pg_data:
